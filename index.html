<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Skeda Network — Inicio</title>
	<link rel="stylesheet" href="static/style.css">
</head>
<body>

	<!-- Nieve decorativa de fondo -->
	<div class="snowfall" id="snowfall"></div>

	<!-- ===================== BARRA DE NAVEGACION (arriba) ===================== -->
	<nav class="mc-menu">
		<a class="mc-button active" href="index.html"><span class="title">Inicio</span></a>
		<a class="mc-button" href="noticias.html"><span class="title">Noticias</span></a>
		<a class="mc-button" href="tienda.html"><span class="title">Tienda</span></a>
		<a class="mc-button" href="reglas.html"><span class="title">Reglas</span></a>
		<a class="mc-button" href="contactar.html"><span class="title">Contactar</span></a>
	</nav>

	<!-- ===================== HERO / LOGO + IP (solo portada) ===================== -->
	<header class="hero">
		<div class="logo-frame">
				 <img src="static/assets/img/SkedaNetwork.png" alt="Skeda Network" draggable="false" oncontextmenu="return false;">
		</div>
		<button type="button" class="ip-line" id="ip-copy" data-ip="ejemplo.com">
			<span class="ip-text">IP: ejemplo.com</span> <!-- Cambiar IP-->
		</button>
		<div class="subtitle">
			<span>Java & Bedrock</span>
			<span class="separator">·</span>
			<span>1.16 - 1.21.11</span>
		</div>
	</header>

	<!-- ===================== CONTENIDO ===================== -->
	<main class="content">
		<section class="ice-panel">
			<h2>Bienvenida</h2>
			<p>Escribe aqui</p>
		</section>
	</main>

	<footer>
		<h4>&copy; 2026 Skeda Network. All rights reserved.</h4>
		<h6 style="text-align: center;">Not affiliated with Mojang AB.</h6>
	</footer>

	<script>
		const field = document.getElementById('snowfall');
		const TOTAL = 40;
		for (let i = 0; i < TOTAL; i++) {
			const flake = document.createElement('span');
			const left = Math.random() * 100;
			const duration = 6 + Math.random() * 10;
			const delay = Math.random() * 10;
			const size = 2 + Math.random() * 3;
			flake.style.left = left + 'vw';
			flake.style.width = flake.style.height = size + 'px';
			flake.style.animationDuration = duration + 's';
			flake.style.animationDelay = delay + 's';
			field.appendChild(flake);
		}
		const ipBtn = document.getElementById('ip-copy');
		if (ipBtn) {
			const ipText = ipBtn.querySelector('.ip-text');
			const original = ipText.textContent;
			ipBtn.addEventListener('click', async () => {
				try {
					await navigator.clipboard.writeText(ipBtn.dataset.ip);
				} catch (err) {
					const temp = document.createElement('textarea');
					temp.value = ipBtn.dataset.ip;
					document.body.appendChild(temp);
					temp.select();
					document.execCommand('copy');
					document.body.removeChild(temp);
				}
				ipBtn.classList.add('copied');
				ipText.textContent = '¡Copiado!';
				setTimeout(() => {
					ipBtn.classList.remove('copied');
					ipText.textContent = original;
				}, 1200);
			});
		}
	</script>
</body>
</html>
