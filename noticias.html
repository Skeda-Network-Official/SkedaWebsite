<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="keywords" content="Skeda Network, Minecraft, Minecraft server, Minecraft network, survival, SMP, gaming, Discord, comunidad, servidores Minecraft">
	<meta name="robots" content="index, follow">
	<meta name="description" content="Skeda Network — Una red de servidores de Minecraft creada para ofrecer una experiencia única a nuestra comunidad.">

	<!-- Open Graph -->
	<meta property="og:title" content="Skeda Network | Minecraft Network">
	<meta property="og:description" content="¡Bienvenido a Skeda Network! Descubre nuestros servidores de Minecraft y únete a nuestra comunidad.">
	<meta property="og:image" content="sin-ip">
	<meta property="og:url" content="sin-ip">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Skeda Network">

	<!-- Twitter Cards -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Skeda Network | Minecraft Network">
	<meta name="twitter:description" content="¡Bienvenido a Skeda Network! Descubre nuestros servidores de Minecraft y únete a nuestra comunidad.">
	<meta name="twitter:image" content="sin-ip">

	<!-- Theme -->
	<meta name="theme-color" content="#4FC3F7">
	<meta name="msapplication-TileColor" content="#4FC3F7">

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="/static/assets/img/SkedaNetwork.png">
	<link rel="apple-touch-icon" href="/static/assets/img/SkedaNetwork.png">
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>

	<div class="snowfall" id="snowfall"></div>

	<nav class="mc-menu">
		<a class="mc-button" href="index.html"><span class="title">Inicio</span></a>
		<a class="mc-button active" href="noticias.html"><span class="title">Noticias</span></a>
		<a class="mc-button" href="tienda.html"><span class="title">Tienda</span></a>
		<a class="mc-button" href="reglas.html"><span class="title">Reglas</span></a>
		<a class="mc-button" href="contactar.html"><span class="title">Contactar</span></a>
	</nav>

	<main class="content">
		<section class="ice-panel">
			<h2>Últimas noticias</h2>
			<div id="noticias-lista">
				<p class="cargando">Cargando noticias...</p>
			</div>
		</section>
	</main>

	<footer>
		<h4>&copy; 2026 Skeda Network. All rights reserved.</h4>
		<h6 style="text-align: center;">Not affiliated with Mojang AB.</h6>
	</footer>

	<script>
		const field = document.getElementById('snowfall');
		const TOTAL = 40;
		for (let i = 0; i < TOTAL; i++) {
			const flake = document.createElement('span');
			const left = Math.random() * 100;
			const duration = 6 + Math.random() * 10;
			const delay = Math.random() * 10;
			const size = 2 + Math.random() * 3;
			flake.style.left = left + 'vw';
			flake.style.width = flake.style.height = size + 'px';
			flake.style.animationDuration = duration + 's';
			flake.style.animationDelay = delay + 's';
			field.appendChild(flake);
		}

		async function cargarNoticias() {
			const contenedor = document.getElementById('noticias-lista');
			try {
				const res = await fetch('/api/noticias');
				if (!res.ok) throw new Error('Error al cargar noticias: ' + res.status);
				const noticias = await res.json();

				if (!noticias.length) {
					contenedor.innerHTML = '<p>Todavía no hay noticias.</p>';
					return;
				}

				noticias.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

				contenedor.innerHTML = noticias.map(n => `
					<article class="noticia">
						<h3>${escaparHTML(n.titulo)}</h3>
						<span class="noticia-fecha">${formatearFecha(n.fecha)}</span>
						<p>${escaparHTML(n.contenido)}</p>
					</article>
				`).join('');
			} catch (err) {
				contenedor.innerHTML = '<p>No se pudieron cargar las noticias.</p>';
				console.error(err);
			}
		}

		function formatearFecha(fechaISO) {
			const opciones = { day: 'numeric', month: 'long', year: 'numeric' };
			return new Date(fechaISO).toLocaleDateString('es-ES', opciones);
		}

		function escaparHTML(texto) {
			const div = document.createElement('div');
			div.textContent = texto;
			return div.innerHTML;
		}

		cargarNoticias();
	</script>
</body>
</html>
